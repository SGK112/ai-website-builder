name: Reconcile Video Credits

on:
  schedule:
    # Every 15 minutes — refund video jobs that failed but were never polled.
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  reconcile:
    name: Reconcile stranded video jobs
    runs-on: ubuntu-latest
    steps:
      - name: Call reconcile endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL || 'https://www.webstew.net' }}
        run: |
          echo "🔁 Reconciling stranded video jobs at $(date)"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET "$APP_URL/api/cron/reconcile-video" \
            -H "Authorization: Bearer $CRON_SECRET")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Reconcile failed with status $HTTP_CODE"
            exit 1
          fi
          echo "✅ Reconcile completed"
