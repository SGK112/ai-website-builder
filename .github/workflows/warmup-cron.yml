name: GPU Endpoint Warmup

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force warm-up even if endpoints are ready'
        required: false
        default: 'false'

jobs:
  warmup:
    name: Warm Up GPU Endpoints
    runs-on: ubuntu-latest
    steps:
      - name: Call warmup endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL || 'https://ai-website-builder-ntzg.onrender.com' }}
        run: |
          echo "🔥 Warming up GPU endpoints at $(date)"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET "$APP_URL/api/cron/warmup" \
            -H "Authorization: Bearer $CRON_SECRET")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Warmup failed with status $HTTP_CODE"
            exit 1
          fi

          # Parse response
          WARMED=$(echo "$BODY" | jq -r '.warmup.warmedUp | length // 0')
          SKIPPED=$(echo "$BODY" | jq -r '.warmup.skipped | length // 0')
          FAILED=$(echo "$BODY" | jq -r '.warmup.failed | length // 0')

          echo ""
          echo "📊 Results:"
          echo "  - Warmed up: $WARMED endpoints"
          echo "  - Already warm: $SKIPPED endpoints"
          echo "  - Failed: $FAILED endpoints"

          if [ "$FAILED" -gt 0 ]; then
            echo "⚠️ Some endpoints failed to warm up"
          else
            echo "✅ Warmup completed successfully"
          fi
